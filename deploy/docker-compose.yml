name: psst

x-app: &app
  build:
    context: ../server
    target: app
  image: psst-app:${APP_TAG:-local}
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - storage:/var/www/html/storage

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../server/public:/var/www/html/public:ro
      # Built front-ends: `pnpm build:pwa` in client/ and `pnpm build` in admin/ before `docker compose up`.
      - ../client/dist/pwa:/srv/client:ro
      - ../admin/dist:/srv/admin/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, reverb]
    networks: [internal, public]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  app:
    <<: *app

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  queue:
    <<: *app
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

# Only caddy publishes ports; postgres/redis are reachable solely on this network.
networks:
  internal:
  public:

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
