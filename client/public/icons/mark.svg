<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Psst">
  <defs>
    <linearGradient id="pw-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6004f"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="pw-clip">
      <rect x="104" y="104" width="816" height="816" rx="228"/>
    </clipPath>
  </defs>

  <!-- the sticker: a rotated squircle with an ink edge -->
  <g transform="rotate(-6 512 512)">
    <rect x="104" y="104" width="816" height="816" rx="228" fill="url(#pw-fill)" stroke="#1b1024" stroke-width="42"/>
    <g clip-path="url(#pw-clip)">
      <rect x="104" y="560" width="816" height="360" fill="#ffffff" opacity=".08"/>
      <circle cx="760" cy="250" r="150" fill="#ffffff" opacity=".12"/>
    </g>
  </g>

  <!-- the whisper: a fat speech bubble with three dots -->
  <g transform="rotate(-6 512 512)">
    <path d="M512 306c-128 0-232 78-232 174 0 58 38 109 98 140-6 40-24 74-52 98 52-4 99-22 136-50 16 3 33 5 50 5 128 0 232-78 232-174S640 306 512 306Z"
          fill="#ffffff" stroke="#1b1024" stroke-width="34" stroke-linejoin="round"/>
    <circle cx="410" cy="492" r="26" fill="#1b1024"/>
    <circle cx="512" cy="492" r="26" fill="#1b1024"/>
    <circle cx="614" cy="492" r="26" fill="#1b1024"/>
  </g>

  <!-- the spark: a lime wink -->
  <path d="M812 236c10 34 24 48 58 58-34 10-48 24-58 58-10-34-24-48-58-58 34-10 48-24 58-58Z"
        fill="#c9ff4f" stroke="#1b1024" stroke-width="18" stroke-linejoin="round"/>
</svg>
